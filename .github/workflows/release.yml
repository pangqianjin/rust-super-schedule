name: 发布

# 打 tag 时触发，例如：
#   git tag v0.1.0
#   git push origin v0.1.0
#
# workflow_dispatch 是「手动跑一次」，用来验证构建能过，不会发 Release。
on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  publish:
    # 创建 Release / 上传安装包需要写权限
    permissions:
      contents: write
    strategy:
      # 一个平台失败时，其它平台继续跑完，便于一次看到全部问题
      fail-fast: false
      matrix:
        include:
          # Apple 芯片（M1/M2/M3）
          - platform: macos-latest
            args: '--target aarch64-apple-darwin'
          # Intel 芯片
          - platform: macos-latest
            args: '--target x86_64-apple-darwin'
          - platform: ubuntu-22.04
            args: ''
          - platform: windows-latest
            args: ''

    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v4

      - name: 安装 Node
        uses: actions/setup-node@v4
        with:
          node-version: lts/*
          cache: yarn

      - name: 安装 Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          # 只有 macOS 需要交叉编译的两个 target，其它平台留空以省时间
          targets: ${{ startsWith(matrix.platform, 'macos') && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}

      - name: 缓存 Rust 依赖
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: './src-tauri -> target'

      - name: 安装 Linux 系统依赖
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf xdg-utils

      - name: 安装前端依赖
        run: yarn install --frozen-lockfile

      # tag 和 tauri.conf.json 里的版本号必须一致，否则会发布出「标签是 v0.2
      # 但应用内显示 0.1」的错版，这里提前拦住。
      - name: 校验版本号
        if: startsWith(github.ref, 'refs/tags/')
        shell: bash
        run: |
          TAG_VERSION="${GITHUB_REF_NAME#v}"
          APP_VERSION=$(node -p "require('./src-tauri/tauri.conf.json').version")
          if [ "$TAG_VERSION" != "$APP_VERSION" ]; then
            echo "::error::tag 是 v$TAG_VERSION，但 src-tauri/tauri.conf.json 里写的是 $APP_VERSION，请先改版本号再重新打 tag"
            exit 1
          fi

      - name: 构建并发布
        uses: tauri-apps/tauri-action@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          # 手动触发时 github.ref 是分支名而非 tag，这里算出来是空串，
          # 于是只构建、不发 Release（tagName 为空即表示不上传）。
          tagName: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || '' }}
          releaseName: ${{ startsWith(github.ref, 'refs/tags/') && format('课时收入记录 {0}', github.ref_name) || '' }}
          releaseBody: |
            下载对应平台的安装包：

            | 平台 | 文件 |
            | --- | --- |
            | macOS（Apple 芯片 M1/M2/M3） | `aarch64.dmg` |
            | macOS（Intel） | `x64.dmg` |
            | Windows | `-setup.exe` 或 `.msi` |
            | Linux | `.AppImage` 或 `.deb` |

            ⚠️ 安装包未做代码签名，首次打开时系统会拦截：

            - **macOS**：右键点应用 → 选「打开」→ 再点一次「打开」。
              或执行 `xattr -dr com.apple.quarantine "/Applications/应用名.app"`
            - **Windows**：SmartScreen 提示时点「更多信息」→「仍要运行」
          # 立刻发布，下载链接马上可用；想先检查再手动发布就改成 true
          releaseDraft: false
          prerelease: false
          # 没配置自动更新，关掉以免 Release 里多出一个用不上的 latest.json
          uploadUpdaterJson: false
          args: ${{ matrix.args }}
